<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꿈 속을 걷는 쿠리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
</head>
<body>
<style>
/* Layout: full-bleed 3D forest floor; time-of-day and "+" controls bottom-right. */
:root{
  --bg:#f3e3c8;
  --ink:#3b2a20;
  --muted:#7a6352;
  --chip:rgba(255,250,240,.82);
  --chip-line:rgba(59,42,32,.18);
  --accent:#c8693a;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);margin:0;overflow:hidden;position:relative}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.seg button{display:grid;place-items:center;padding:7px 10px}
.btn{display:flex;align-items:center;gap:4px}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:flex-end;gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px calc(16px + env(safe-area-inset-bottom, 0px));pointer-events:none}
.ui > *{pointer-events:auto}
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--chip);border:1px solid var(--chip-line);border-radius:12px;padding:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{font:inherit;font-size:14px;color:var(--bg);background:var(--accent);border:0;border-radius:12px;padding:9px 14px;cursor:pointer;
  font-variant-numeric:tabular-nums}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<canvas id="view" aria-label="밤만쥬가 가을 숲을 걸어다니는 3D 장면"></canvas>
<div class="ui">
  <div class="ctl">
    <div class="seg" role="group" aria-label="시간">
      <button data-t="0" aria-pressed="true" aria-label="낮"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
      <button data-t="1" aria-pressed="false" aria-label="노을"><svg viewBox="0 0 24 24"><path d="M6.5 16a5.5 5.5 0 0 1 11 0"/><path d="M3 19.5h18M12 4.5v3M4.6 9.1l2 1.6M19.4 9.1l-2 1.6"/></svg></button>
      <button data-t="2" aria-pressed="false" aria-label="밤"><svg viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg></button>
    </div>
    <button class="btn" id="add" aria-label="쿠리만주 더 부르기"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg><span id="count">1</span></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .1, 200);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

// toon ramp for a soft, picture-book look
const ramp = new THREE.DataTexture(new Uint8Array([90,170,235,255]), 4, 1, THREE.LuminanceFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const T = (c, o={}) => new THREE.MeshToonMaterial({color:c, gradientMap:ramp, ...o});

const fog = new THREE.Fog(0xffffff, 18, 48); scene.fog = fog;
const hemi = new THREE.HemisphereLight(0xffffff, 0x886644, .6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(-8,14,6); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16}); scene.add(sun);
const shade = o => { o.traverse(m=>{ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } }); return o; };

// ---- ground: a round mossy clearing ----
const groundMat = T(0x9cb36a);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48), groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const path = new THREE.Mesh(new THREE.RingGeometry(5.2, 6.4, 48), T(0xd9b98a));
path.rotation.x = -Math.PI/2; path.position.y = .01; path.receiveShadow = true; scene.add(path);

// pond with stepping stones
const pond = new THREE.Mesh(new THREE.CircleGeometry(2.4, 24), new THREE.MeshPhongMaterial({color:0x8ec9d6, shininess:90, transparent:true, opacity:.9}));
pond.rotation.x = -Math.PI/2; pond.position.set(-3.2,.02,-1.5); pond.scale.set(1.3,1,1); scene.add(pond);
[[-1.2,-.4],[-1.7,.5],[-2.4,1.1]].forEach(([x,z])=>{const s=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,.12,7),T(0xb9b2a6));s.position.set(x,.05,z);scene.add(shade(s));});
const pads = [[-4.2,-2.2],[-2.4,-2.6],[-4.6,-.6]].map(([x,z])=>{const p=new THREE.Mesh(new THREE.CircleGeometry(.4,10,.3,Math.PI*1.8),T(0x6f9a4a));
  p.rotation.x=-Math.PI/2;p.position.set(x,.04,z);scene.add(p);return p;});

// round autumn trees
const leafCols = [0xe8a23a, 0xd9682f, 0xf0c55a, 0xc4472d];
function tree(x,z,s){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,2*s,6), T(0x6b4630)); trunk.position.y = s; g.add(trunk);
  const col = leafCols[Math.floor(Math.random()*leafCols.length)];
  [[0,2.6,0,1.3],[.7,2.2,.2,.9],[-.6,2.3,-.2,.95],[.1,3.3,.1,.8]].forEach(([a,b,c,r])=>{
    const f = new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,1), T(col)); f.position.set(a*s,b*s,c*s); g.add(f);
  });
  g.position.set(x,0,z); g.rotation.y = Math.random()*6; scene.add(shade(g)); return g;
}
for (let i=0;i<16;i++){ const a = i/16*Math.PI*2 + Math.random()*.2, r = 10 + Math.random()*5; tree(Math.cos(a)*r, Math.sin(a)*r, .9+Math.random()*.6); }

// mushrooms
function mushroom(x,z,s,cap){
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.09*s,.12*s,.35*s,8), T(0xf6ecd8)); stem.position.y=.17*s; g.add(stem);
  const c = new THREE.Mesh(new THREE.SphereGeometry(.26*s,12,8,0,Math.PI*2,0,Math.PI/2), T(cap)); c.position.y=.32*s; c.scale.y=.75; g.add(c);
  for(let i=0;i<4;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.035*s,6,4),T(0xffffff));const a=i*1.7;d.position.set(Math.cos(a)*.15*s,.44*s,Math.sin(a)*.15*s);g.add(d);}
  g.position.set(x,0,z); scene.add(shade(g));
}
[[2.5,-3,1.3,0xd2453a],[2.9,-2.6,.8,0xd2453a],[4.5,1.6,1,0xe0883a],[-6.8,3.2,1.4,0xd2453a],[6.6,-4.4,1.1,0xb5559a],[-1,4.4,.9,0xe0883a]]
  .forEach(a=>mushroom(...a));

// chestnut burrs + fallen chestnuts
function burr(x,z){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.32,1),T(0x9fae4a));b.position.y=.25;g.add(b);
  const sp=new THREE.ConeGeometry(.04,.22,4);
  const pos=b.geometry.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<pos.count;i+=3){v.fromBufferAttribute(pos,i).normalize();const s=new THREE.Mesh(sp,T(0x7e8f36));
    s.position.copy(v).multiplyScalar(.36).add(b.position);s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v);g.add(s);}
  g.position.set(x,0,z);scene.add(shade(g));
}
[[3.6,3.2],[-5.5,-4.8],[1.2,-5.8]].forEach(a=>burr(...a));
[[3.9,2.7],[3.2,3.7],[-5,-4.3]].forEach(([x,z])=>{const n=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),T(0x6a3a22));n.scale.set(1,.8,.85);n.position.set(x,.12,z);scene.add(shade(n));});

// a small wooden bench and lantern
const bench=new THREE.Group();
const seat=new THREE.Mesh(new THREE.BoxGeometry(2,.12,.6),T(0xa9774c));seat.position.y=.55;bench.add(seat);
[[-.85,0],[.85,0]].forEach(([x])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.12,.55,.5),T(0x7d5536));l.position.set(x,.27,0);bench.add(l);});
bench.position.set(5.6,0,-1.2);bench.rotation.y=-1.2;scene.add(shade(bench));
const lantern=new THREE.Group();
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.8,6),T(0x3b2a20));pole.position.y=.9;lantern.add(pole);
const lampMat=new THREE.MeshBasicMaterial({color:0xffe2a0});
const lamp=new THREE.Mesh(new THREE.BoxGeometry(.3,.38,.3),lampMat);lamp.position.y=1.95;lantern.add(lamp);
const lampLight=new THREE.PointLight(0xffc37a,0,9,2);lampLight.position.y=1.95;lantern.add(lampLight);
lantern.position.set(6.3,0,.6);scene.add(shade(lantern));

// falling leaves
const leafGeo = new THREE.PlaneGeometry(.22,.14);
const leaves = Array.from({length:40},()=>{const m=new THREE.Mesh(leafGeo,new THREE.MeshLambertMaterial({color:leafCols[Math.floor(Math.random()*4)],side:THREE.DoubleSide}));
  scene.add(m); resetLeaf(m,true); return m;});
function resetLeaf(m,init){ m.position.set((Math.random()-.5)*26, init?Math.random()*8:8+Math.random()*2, (Math.random()-.5)*26);
  m.userData={v:.35+Math.random()*.4, ph:Math.random()*6, spin:(Math.random()-.5)*4}; }

// fireflies (night)
const flyGeo = new THREE.SphereGeometry(.05,6,4);
const flies = Array.from({length:36},()=>{const m=new THREE.Mesh(flyGeo,new THREE.MeshBasicMaterial({color:0xfff3a0,transparent:true,opacity:0}));
  m.userData={o:new THREE.Vector3((Math.random()-.5)*20,.4+Math.random()*2.5,(Math.random()-.5)*20),ph:Math.random()*9};scene.add(m);return m;});

// ---- Kurimanju: one soft bean-shaped body (head wider than body), chestnut cap with a curved edge ----
const LINE = 0x3a2218;
const bunRamp = new THREE.DataTexture(new Uint8Array([212,244]), 2, 1, THREE.LuminanceFormat);
bunRamp.minFilter = bunRamp.magFilter = THREE.NearestFilter; bunRamp.needsUpdate = true;
const toon = c => new THREE.MeshToonMaterial({color:c, gradientMap:bunRamp});
const KURI = (() => {
  const ctrl = [[0,0],[.36,.01],[.6,.1],[.76,.28],[.82,.52],[.82,.78],[.76,1.02],[.62,1.25],[.38,1.42],[0,1.5]]
    .map(([x,y])=>new THREE.Vector2(x,y));
  const prof = new THREE.SplineCurve(ctrl).getSpacedPoints(120);
  prof[0].x = .001; prof[prof.length-1].x = .001;
  const S=[0]; for (let i=1;i<prof.length;i++) S.push(S[i-1]+prof[i].distanceTo(prof[i-1]));
  const L = S[S.length-1], RH = .82;
  const at = y => { for (let i=1;i<prof.length;i++) if (prof[i].y>=y){ const f=(y-prof[i-1].y)/(prof[i].y-prof[i-1].y||1);
      return {r:prof[i-1].x+(prof[i].x-prof[i-1].x)*f, s:S[i-1]+(S[i]-S[i-1])*f}; } return {r:0,s:L}; };
  const W = 2048, H = Math.round(W*L/(2*Math.PI*RH)), k = W/(2*Math.PI*RH);
  const edgeY = phi => 1.1 + .28*(1-Math.cos(2*phi))/2;

  // one texture per expression; u wraps around (front = centre), v follows arc length
  function face(kind){
    const cv = document.createElement('canvas'); cv.width=W; cv.height=H; const g = cv.getContext('2d');
    const P = (x,y) => { const q = at(y); return [W/2 + Math.asin(Math.max(-1,Math.min(1,x/q.r)))/(2*Math.PI)*W, (1-q.s/L)*H]; };
    g.fillStyle = '#f4c4a0'; g.fillRect(0,0,W,H);
    g.beginPath(); g.moveTo(0,0);
    for (let px=0; px<=W; px+=4){ const phi=(px/W-.5)*2*Math.PI; g.lineTo(px, (1-at(edgeY(phi)).s/L)*H); }
    g.lineTo(W,0); g.closePath(); g.fillStyle='#6f4434'; g.fill();
    g.strokeStyle='#3a2218'; g.lineWidth=.022*k; g.lineJoin='round'; g.stroke();
    const ink = '#2a1610';
    [-1,1].forEach(sd=>{
      const [ex,ey] = P(.26*sd, .77);
      g.fillStyle=ink; g.beginPath(); g.ellipse(ex,ey,.06*k,.066*k,0,0,7); g.fill();
      g.fillStyle='#fff'; g.beginPath(); g.ellipse(ex,ey+.014*k,.032*k,.024*k,0,0,7); g.fill();
      g.fillStyle=ink; g.beginPath(); g.ellipse(ex,ey+.007*k,.036*k,.03*k,0,0,7); g.fill();
      g.fillStyle='#fff'; g.beginPath(); g.arc(ex-.02*k,ey-.023*k,.018*k,0,7); g.fill();
      const [bx,by] = P(.5*sd, .66);
      g.fillStyle='#f7b3c2'; g.beginPath(); g.ellipse(bx,by,.135*k,.08*k,0,0,7); g.fill();
      g.strokeStyle='#5a3328'; g.lineWidth=.013*k; g.lineCap='round';
      for (let j=-1;j<=1;j++){ const x=bx+j*.058*k; g.beginPath(); g.moveTo(x+.018*k,by-.04*k); g.lineTo(x-.018*k,by+.04*k); g.stroke(); }
    });
    g.strokeStyle=ink; g.fillStyle=ink; g.lineCap='round'; g.lineJoin='round'; g.lineWidth=.016*k;
    const [wx,wy] = P(0, .86);
    const line = (x1,y1,x2,y2)=>{ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); };
    if (kind === 'open'){
      // scrunched nose lines fanning out
      [-2,-1,0,1,2].forEach(j=>line(wx+j*.032*k, wy-.04*k+Math.abs(j)*.01*k, wx+j*.042*k, wy+.02*k));
      line(wx-.07*k, wy+.04*k, wx+.07*k, wy+.04*k);
      // wide open mouth with teeth and tongue
      const [mx,my] = P(0, .56), w=.065*k, h=.09*k;
      g.beginPath(); g.moveTo(mx-w, my-h*.45);
      g.quadraticCurveTo(mx-w*.5, my-h*.2, mx, my-h*.5); g.quadraticCurveTo(mx+w*.5, my-h*.2, mx+w, my-h*.45);
      g.quadraticCurveTo(mx+w*.8, my+h*.9, mx, my+h*.8); g.quadraticCurveTo(mx-w*.8, my+h*.9, mx-w, my-h*.45); g.closePath();
      g.fillStyle='#4a1d1d'; g.fill(); g.stroke();
      g.save(); g.clip();
      g.fillStyle='#e9849a'; g.beginPath(); g.ellipse(mx, my+h*.65, w*.55, h*.45, 0, 0, 7); g.fill();
      g.fillStyle='#fff';
      for (let i=-3;i<=3;i++){ const tx=mx+i*w*.24; g.beginPath(); g.moveTo(tx-w*.1,my-h*.5); g.lineTo(tx+w*.1,my-h*.5); g.lineTo(tx,my-h*.12); g.fill(); }
      g.restore();
      const [cx2,cy2] = P(0, .42); line(cx2-.03*k, cy2, cx2+.03*k, cy2);
    } else {
      [-1,0,1].forEach(j=>line(wx+j*.03*k, wy-.022*k, wx+j*.03*k+.004*k, wy+.012*k));
      const [mx,my] = P(0, .58), m=.034*k;
      g.beginPath(); g.moveTo(mx-1.9*m, my-.5*m);
      g.quadraticCurveTo(mx-1.6*m, my+.9*m, mx-.8*m, my+.6*m); g.quadraticCurveTo(mx-.2*m, my+.35*m, mx, my-.15*m);
      g.quadraticCurveTo(mx+.2*m, my+.35*m, mx+.8*m, my+.6*m); g.quadraticCurveTo(mx+1.6*m, my+.9*m, mx+1.9*m, my-.5*m); g.stroke();
      const [cx2,cy2] = P(0, .5);
      g.beginPath(); g.moveTo(cx2-.03*k, cy2-.008*k); g.quadraticCurveTo(cx2, cy2+.022*k, cx2+.03*k, cy2-.008*k); g.stroke();
      if (kind === 'munch'){ // crumbs on the cheek
        g.fillStyle='#b57a4c'; [[.12,.62,.016],[.15,.57,.011],[-.13,.6,.012]].forEach(([x,y,r])=>{const [px,py]=P(x,y); g.beginPath(); g.arc(px,py,r*k,0,7); g.fill(); g.stroke();});
      }
      if (kind === 'sip'){ // little droplet under the mouth
        const [dx,dy] = P(-.04, .54); g.beginPath(); g.moveTo(dx,dy-.02*k); g.quadraticCurveTo(dx+.022*k,dy+.02*k,dx,dy+.03*k); g.quadraticCurveTo(dx-.022*k,dy+.02*k,dx,dy-.02*k); g.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 8;
    return new THREE.MeshToonMaterial({map:tex, gradientMap:bunRamp});
  }
  const bodyGeo = new THREE.LatheGeometry(prof, 72, Math.PI, Math.PI*2);
  const hullGeo = bodyGeo.clone(); { const p=hullGeo.attributes.position, n=hullGeo.attributes.normal;
    for (let i=0;i<p.count;i++) p.setXYZ(i, p.getX(i)+n.getX(i)*.028, p.getY(i)+n.getY(i)*.028, p.getZ(i)+n.getZ(i)*.028); }
  const earPos = sd => { const y=1.2, q=at(y); return new THREE.Vector3(q.r*.98*sd, y, 0); };
  const torsoGeo = new THREE.SphereGeometry(.52, 40, 28);
  const faces = {}; const faceMat = kind => faces[kind] || (faces[kind] = face(kind));
  return { bodyGeo, hullGeo, torsoGeo, earPos, faceMat, cream: toon(0xf4c4a0),
    line: new THREE.MeshBasicMaterial({color:LINE, side:THREE.BackSide}), nub: new THREE.SphereGeometry(1, 20, 14) };
})();
// outlined part: the mesh plus a slightly larger back-face shell in the line colour
function part(parent, geo, mat, pos, scl=[1,1,1], pad=.025){
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.scale.set(...scl); parent.add(m);
  const o = new THREE.Mesh(geo, KURI.line); o.scale.set(1+pad/Math.max(.05,scl[0])*0+pad*3, 1+pad*3, 1+pad*3); m.add(o);
  return m;
}
function nub(parent, x,y,z, sx,sy,sz){
  const m = new THREE.Mesh(KURI.nub, KURI.cream); m.position.set(x,y,z); m.scale.set(sx,sy,sz); parent.add(m);
  const o = new THREE.Mesh(KURI.nub, KURI.line); o.position.copy(m.position); o.scale.set(sx+.028,sy+.028,sz+.028); parent.add(o);
  return m;
}
// props held in the right hand (screen right)
const PROPS = {
  can(h){ const g=new THREE.Group();
    part(g,new THREE.CylinderGeometry(.11,.11,.08,20),toon(0xd9d9d6),[0,.12,0]);
    part(g,new THREE.CylinderGeometry(.11,.11,.12,20),toon(0xd67554),[0,.02,0]);
    part(g,new THREE.CylinderGeometry(.11,.11,.1,20),toon(0xf5c9c4),[0,-.09,0]);
    g.position.set(.65,.52,.3); h.add(g); },
  glass(h){ const g=new THREE.Group();
    const c=new THREE.Mesh(new THREE.CylinderGeometry(.17,.14,.34,24,1,true),new THREE.MeshPhongMaterial({color:0xcfeef7,transparent:true,opacity:.55,side:THREE.DoubleSide,shininess:80}));
    g.add(c); const drink=new THREE.Mesh(new THREE.CylinderGeometry(.155,.14,.24,24),new THREE.MeshPhongMaterial({color:0xfff6c8,transparent:true,opacity:.55})); drink.position.y=-.04; g.add(drink);
    const lemon=part(g,new THREE.CylinderGeometry(.09,.09,.025,20),toon(0xf6d84a),[-.15,.15,.05]); lemon.rotation.set(Math.PI/2,0,.4);
    g.position.set(.62,.5,.4); h.add(g); },
  manju(h){ const g=new THREE.Group();
    part(g,new THREE.SphereGeometry(.1,16,10,0,Math.PI*2,0,Math.PI/2),toon(0x7a4a32),[0,0,0],[1,.8,1]);
    part(g,new THREE.CylinderGeometry(.1,.095,.06,16),toon(0xf2d3a2),[0,-.03,0]);
    g.position.set(.34,.5,.48); h.add(g); },
  sausage(h){ const g=new THREE.Group();
    const s=part(g,new THREE.CylinderGeometry(.06,.06,.3,14),toon(0xa8432e),[0,0,0]); s.rotation.z=Math.PI/2+.15;
    [-.15,.15].forEach(x=>part(g,new THREE.SphereGeometry(.06,12,8),toon(0xa8432e),[x,x*.15,0]));
    const fork=part(g,new THREE.CylinderGeometry(.012,.012,.5,6),toon(0xbfc3c7),[.27,-.17,0],[1,1,1],.01); fork.rotation.z=.9;
    g.position.set(.1,1.12,.78); h.add(g); },
};
// the five versions, from the reference pictures
const VARIANTS = [
  {face:'calm'},                    // plain, just strolling
  {face:'sip',   prop:'can'},       // "후―…" with a can
  {face:'open',  prop:'glass'},     // big open-mouthed "하―!" with lemonade
  {face:'munch', prop:'manju'},     // nibbling a chestnut bun
  {face:'calm',  prop:'sausage'},   // sausage on a fork
];
function makeBun(scale=1, variant=0){
  const V = VARIANTS[variant % VARIANTS.length];
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  // small round body underneath
  const torso = new THREE.Mesh(KURI.torsoGeo, KURI.cream); torso.scale.set(1.0,.9,.9); torso.position.y = .4; body.add(torso);
  const torsoLine = new THREE.Mesh(KURI.torsoGeo, KURI.line); torsoLine.scale.set(1.0*1.05,.9*1.05,.9*1.05); torsoLine.position.y = .4; body.add(torsoLine);
  // big head in front, its outline overlaps the body so the two read as separate
  const head = new THREE.Object3D(); head.position.y = .5; body.add(head);
  const b = new THREE.Mesh(KURI.bodyGeo, KURI.faceMat(V.face)); b.scale.z = .9; head.add(b);
  const hull = new THREE.Mesh(KURI.hullGeo, KURI.line); hull.scale.z = .9; head.add(hull);
  [-1,1].forEach(sd=>{
    const e = KURI.earPos(sd); nub(head, e.x, e.y, -.02, .13, .11, .1);
    const holding = V.prop && sd === 1;
    nub(body, .5*sd, holding ? .5 : .42, holding ? .16 : .08, .1, .15, .1).rotation.z = (holding ? 1.0 : .4)*sd;
    nub(body, .24*sd, .04, .22, .16, .085, .18);
  });
  if (V.prop){ PROPS[V.prop](body); const pg = body.children[body.children.length-1]; pg.scale.setScalar(1.35); }
  g.scale.setScalar(scale*.85); scene.add(g);
  g.traverse(m=>{ if (m.isMesh && m.material !== KURI.line){ m.castShadow = true; } });
  const bun = {g, body, head, variant, speed:.9+Math.random()*.4, target:new THREE.Vector3(), wait:Math.random()*2, ph:Math.random()*9, hop:0};
  g.position.set((Math.random()-.5)*6, 0, (Math.random()-.5)*6 + 1);
  pick(bun); return bun;
}
function pick(bun){
  for (let i=0;i<20;i++){ // avoid the pond
    const a=Math.random()*Math.PI*2, r=Math.random()*7.5;
    bun.target.set(Math.cos(a)*r,0,Math.sin(a)*r);
    if (bun.target.distanceTo(new THREE.Vector3(-3.2,0,-1.5))>3.4) return;
  }
}
const myVariant = Math.floor(Math.random()*5);
const buns = [makeBun(1, myVariant)];

function step(bun, dt, t){
  const p = bun.g.position, to = bun.target.clone().sub(p); to.y = 0;
  let walking = false;
  if (bun.wait > 0){ bun.wait -= dt; if (bun.wait<=0) pick(bun); }
  else if (to.length() < .2){ bun.wait = 1.2 + Math.random()*3; }
  else {
    walking = true; to.normalize(); p.addScaledVector(to, bun.speed*dt); bun.dirX = to.x; bun.dirZ = to.z;
  }
  // always show the face: look at the camera, leaning only a little toward the walking direction
  const camYaw = Math.atan2(camera.position.x-p.x, camera.position.z-p.z);
  let want = camYaw;
  if (walking){ const rel = Math.atan2(bun.dirX, bun.dirZ) - camYaw; want += Math.sin(rel)*.55; }
  let dd = want - bun.g.rotation.y; dd = Math.atan2(Math.sin(dd), Math.cos(dd)); bun.g.rotation.y += dd*Math.min(1, dt*6);
  const ph = t*9 + bun.ph;
  let y = walking ? Math.abs(Math.sin(ph))*.035 : 0;
  if (bun.hop > 0){ bun.hop -= dt*1.6; y += Math.sin((1-Math.max(bun.hop,0))*Math.PI)*.6; }
  bun.body.position.y = y; bun.body.rotation.z = walking ? Math.sin(ph)*.06 : 0;
  bun.head.rotation.z = walking ? Math.sin(ph+1)*.05 : Math.sin(t*.8+bun.ph)*.04;
  const sq = 1 + Math.sin(t*1.6+bun.ph)*.008;
  bun.body.scale.set(1/Math.sqrt(sq), sq, 1/Math.sqrt(sq));
}

// ---- time of day ----
const TIMES = [
  {sky:0xf6e6c6, ground:0x9cb36a, hemi:[0xfff6e0,0x8a6a44,.65], sun:[0xfff2d8,.95], lamp:0, fly:0, page:'#f3e3c8'},
  {sky:0xf2a77c, ground:0x9a9a58, hemi:[0xffc9a0,0x6a3a3a,.55], sun:[0xff9a62,.85], lamp:.6, fly:.2, page:'#efb08a'},
  {sky:0x1e2448, ground:0x3e5440, hemi:[0x7f8ad8,0x1a1a2c,.4], sun:[0x9fb0ff,.25], lamp:2.2, fly:1, page:'#1e2448'},
];
let flyLevel = 0, flyTarget = 0;
function setTime(i){
  const c = TIMES[i];
  scene.background = new THREE.Color(c.sky); fog.color.set(c.sky); groundMat.color.set(c.ground);
  hemi.color.set(c.hemi[0]); hemi.groundColor.set(c.hemi[1]); hemi.intensity = c.hemi[2];
  sun.color.set(c.sun[0]); sun.intensity = c.sun[1]; lampLight.intensity = c.lamp;
  lampMat.color.set(c.lamp>1 ? 0xffe2a0 : 0xd8c9a8); flyTarget = c.fly;
  document.body.style.background = c.page;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.t===i)));
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setTime(+b.dataset.t)));
const countEl = document.getElementById('count');
let localNext = myVariant + 1;
document.getElementById('add').addEventListener('click',()=>{
  if (buns.length >= 30) return;
  const b = makeBun(.8 + Math.random()*.25, localNext++); b.g.position.set(buns[0].g.position.x+(Math.random()-.5)*4, 0, buns[0].g.position.z+(Math.random()-.5)*3); buns.push(b); countEl.textContent = buns.length;
});

// ---- everyone who has this page open gets their own Kurimanju ----
const people = new Map();   // peer label -> bun
const youMark = new THREE.Mesh(new THREE.ConeGeometry(.12,.22,4), new THREE.MeshBasicMaterial({color:0xf27a9a}));
youMark.rotation.x = Math.PI; youMark.position.y = 2.15; youMark.visible = false; buns[0].g.add(youMark);
function removeBun(b){ scene.remove(b.g); const i = buns.indexOf(b); if (i >= 0) buns.splice(i,1); }
function syncPeers(peers){
  const seen = new Set();
  for (const p of peers){
    if (p.kind !== 'viewer') continue;
    seen.add(p.peer);
    if (p.sameTab){ people.set(p.peer, buns[0]); continue; }
    const v = p.presence && Number.isInteger(p.presence.v) ? ((p.presence.v % 5) + 5) % 5 : null;
    let b = people.get(p.peer);
    if (b && v !== null && b.variant !== v){ removeBun(b); b = null; people.delete(p.peer); }
    if (!b && v !== null && buns.length < 40){
      b = makeBun(.8 + Math.random()*.25, v); b.g.position.set(buns[0].g.position.x+(Math.random()-.5)*4, 0, buns[0].g.position.z+(Math.random()-.5)*3); buns.push(b); people.set(p.peer, b);
    }
  }
  for (const [peer, b] of people) if (!seen.has(peer) && b !== buns[0]){ removeBun(b); people.delete(peer); }
  youMark.visible = people.size > 1;
  countEl.textContent = buns.length;
}
(async () => {
  try {
    const room = await window.claude?.use?.('room');
    if (!room) return;
    room.presence({v: myVariant}).catch(()=>{});
    room.onPeers(ch => syncPeers(ch.peers), () => {});
  } catch (e) {}
})();

// ---- drag to orbit ----
let yaw = 0, yawV = 0, dragging = false, lastX = 0, idle = 0;
canvas.addEventListener('pointerdown', e=>{dragging=true; lastX=e.clientX; canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove', e=>{ if(!dragging) return; yawV = (e.clientX-lastX)*-.006; yaw += yawV; lastX=e.clientX; idle=0; });
canvas.addEventListener('pointerup', ()=>dragging=false);

// ---- loop ----
const clock = new THREE.Clock(), look = new THREE.Vector3(0,.6,0);
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, sp = reduce ? .4 : 1;
  buns.forEach(b=>step(b, dt*sp, t));
  idle += dt; if (!dragging){ yawV *= .92; yaw += yawV; if (idle > 4 && !reduce) yaw += dt*.03; }
  const lead = buns[0].g.position;
  look.lerp(new THREE.Vector3(lead.x, .95, lead.z), dt*2);
  const dist = innerWidth < 600 ? 6.4 : 5.6;
  camera.position.set(look.x + Math.sin(yaw)*dist, 1.8, look.z + Math.cos(yaw)*dist);
  camera.lookAt(look);
  leaves.forEach(m=>{const u=m.userData; m.position.y -= u.v*dt*sp; m.position.x += Math.sin(t*1.3+u.ph)*dt*.4*sp;
    m.rotation.x += u.spin*dt*sp; m.rotation.z += u.spin*.7*dt*sp; if (m.position.y < .03){ m.position.y=.03; m.rotation.set(-Math.PI/2,0,u.ph); if(Math.random()<.004) resetLeaf(m); }});
  flyLevel += (flyTarget-flyLevel)*Math.min(1,dt*2);
  flies.forEach(f=>{const u=f.userData; f.position.set(u.o.x+Math.sin(t*.5+u.ph)*.8, u.o.y+Math.sin(t*.9+u.ph)*.3, u.o.z+Math.cos(t*.4+u.ph)*.8);
    f.material.opacity = flyLevel*(.5+.5*Math.sin(t*3+u.ph)); f.visible = flyLevel > .02;});
  pads.forEach((p,i)=>p.position.y = .04 + Math.sin(t+i)*.008);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize(); setTime(0); frame();
})();
</script>
